services:
  zirva:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Укажите ADMIN_PASSWORD в .env}
      PUBLIC_ORIGINS: ${PUBLIC_ORIGINS:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - zirva-data:/data
    restart: unless-stopped
volumes:
  zirva-data:
